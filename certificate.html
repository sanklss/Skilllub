<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сертификат LearnBox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #e8eef2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'Helvetica', sans-serif;
            padding: 10px;
        }
        
        .certificate {
            width: 297mm;
            height: 210mm;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        
        .border {
            position: absolute;
            top: 8mm;
            left: 8mm;
            right: 8mm;
            bottom: 8mm;
            border: 1px solid #c0c0c0;
        }
        
        .corner {
            position: absolute;
            width: 12mm;
            height: 12mm;
            border-color: #4a6fa5;
            border-style: solid;
            border-width: 0;
        }
        
        .corner-tl {
            top: 12mm;
            left: 12mm;
            border-top-width: 2px;
            border-left-width: 2px;
        }
        
        .corner-tr {
            top: 12mm;
            right: 12mm;
            border-top-width: 2px;
            border-right-width: 2px;
        }
        
        .corner-bl {
            bottom: 12mm;
            left: 12mm;
            border-bottom-width: 2px;
            border-left-width: 2px;
        }
        
        .corner-br {
            bottom: 12mm;
            right: 12mm;
            border-bottom-width: 2px;
            border-right-width: 2px;
        }
        
        .content {
            position: absolute;
            top: 20mm;
            left: 20mm;
            right: 20mm;
            bottom: 20mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .header {
            text-align: center;
            margin-bottom: 5mm;
        }
        
        .logo {
            font-size: 24pt;
            color: #2c3e50;
            letter-spacing: 2px;
            font-weight: 300;
            margin-bottom: 3mm;
        }
        
        .logo strong {
            font-weight: 600;
            color: #4a6fa5;
        }
        
        .title {
            font-size: 36pt;
            color: #4a6fa5;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 2mm;
        }
        
        .subtitle {
            font-size: 14pt;
            color: #7f8c8d;
            font-weight: 300;
        }
        
        .main {
            text-align: center;
            margin: 5mm 0;
        }
        
        .presented {
            font-size: 16pt;
            color: #7f8c8d;
            margin-bottom: 5mm;
            font-weight: 300;
        }
        
        .recipient {
            font-size: 32pt;
            color: #2c3e50;
            margin: 3mm 0;
            font-weight: 500;
            border-bottom: 2px solid #e0e0e0;
            border-top: 2px solid #e0e0e0;
            padding: 3mm 0;
        }
        
        .course-label {
            font-size: 16pt;
            color: #7f8c8d;
            margin: 5mm 0 2mm 0;
            font-weight: 300;
        }
        
        .course-name {
            font-size: 24pt;
            color: #4a6fa5;
            font-weight: 500;
        }
        
        .date {
            font-size: 14pt;
            color: #95a5a6;
            margin: 5mm 0;
        }
        
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 5mm;
            padding-top: 3mm;
            border-top: 1px solid #e0e0e0;
        }
        
        .signature-block {
            text-align: center;
            width: 70mm;
        }
        
        .signature-line {
            width: 100%;
            height: 1px;
            background: #2c3e50;
            margin: 2mm 0 1mm 0;
        }
        
        .signature-name {
            font-size: 12pt;
            color: #2c3e50;
            font-weight: 500;
        }
        
        .signature-title {
            font-size: 10pt;
            color: #95a5a6;
        }
        
        .certificate-id {
            font-size: 9pt;
            color: #bdc3c7;
            text-align: center;
            margin-top: 3mm;
            font-family: monospace;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .certificate {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="border"></div>
        
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        
        <div class="content">
            <div class="header">
                <div class="logo">LEARN<span style="font-weight:600;">BOX</span></div>
                <div class="title">СЕРТИФИКАТ</div>
                <div class="subtitle">об успешном прохождении курса</div>
            </div>
            
            <div class="main">
                <div class="presented">Настоящий сертификат вручается</div>
                
                <div class="recipient" id="student-name">
                    Григорий
                </div>
                
                <div class="course-label">завершившему(ей) курс</div>
                
                <div class="course-name" id="course-name">
                    Python для начинающих
                </div>
                
                <div class="date" id="completion-date">
                    20 февраля 2026 года
                </div>
            </div>
            
            <div class="footer">
                <div class="signature-block">
                    <div class="signature-line"></div>
                    <div class="signature-name" id="director-name">А.В. Петров</div>
                    <div class="signature-title">Директор LearnBox</div>
                </div>
                
                <div class="signature-block">
                    <div class="signature-line"></div>
                    <div class="signature-name" id="teacher-name">И.И. Иванов</div>
                    <div class="signature-title">Преподаватель</div>
                </div>
            </div>
            
            <div class="certificate-id" id="certificate-number">
                LB-20260220-7F8D3B2A
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        document.addEventListener('DOMContentLoaded', () => {
            const studentName = urlParams.get('name');
            const courseName = urlParams.get('course');
            const completionDate = urlParams.get('date');
            const certNumber = urlParams.get('cert');
            const teacherName = urlParams.get('teacher');
            
            if (studentName) document.getElementById('student-name').textContent = decodeURIComponent(studentName);
            if (courseName) document.getElementById('course-name').textContent = decodeURIComponent(courseName);
            if (teacherName) document.getElementById('teacher-name').textContent = decodeURIComponent(teacherName);
            
            if (completionDate) {
                const date = new Date(completionDate);
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                document.getElementById('completion-date').textContent = date.toLocaleDateString('ru-RU', options);
            }
            
            if (certNumber) {
                document.getElementById('certificate-number').textContent = certNumber;
            }
        });
    </script>
</body>
</html>
