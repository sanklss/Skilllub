<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnBox - Панель преподавателя</title>
  <link rel="stylesheet" href="../css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .students-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    
    .students-table th,
    .students-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .students-table th {
      background: #f7fafc;
      font-weight: 600;
      color: #2d3748;
    }
    
    .students-table tr:hover {
      background: #f7fafc;
    }
    
    .progress-bar-small {
      width: 100px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      margin-right: 8px;
    }
    
    .course-stats {
      display: flex;
      gap: 20px;
      margin: 15px 0;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #2d3748;
      display: block;
    }
    
    .stat-label {
      font-size: 12px;
      color: #718096;
    }
    
    .teacher-course-card {
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .teacher-course-card:hover {
      transform: translateY(-2px);
    }
    
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    
    .student-progress-modal {
      max-width: 800px;
      width: 90%;
    }
    
    .lesson-progress-item {
      padding: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .lesson-progress-item:last-child {
      border-bottom: none;
    }
    
    .status-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    
    .status-badge.completed {
      background: #c6f6d5;
      color: #22543d;
    }
    
    .status-badge.pending {
      background: #feebc8;
      color: #744210;
    }
    
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .btn-xs {
      padding: 4px 8px;
      font-size: 12px;
    }
    .course-badge {
        background: #f0f9ff;
        border: 1px solid #bae6fd;
        border-radius: 4px;
        padding: 4px 8px;
        margin: 4px 0;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    
    .course-select-btn {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s;
    }
    
    .course-select-btn:hover {
        background: #f7fafc;
        border-color: #4299e1;
        transform: translateY(-2px);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    
    .progress-mini {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 5px;
    }
    
    .progress-mini .progress-bar {
        height: 6px;
        background: #4299e1;
        border-radius: 3px;
        transition: width 0.3s;
    }
    
    .btn-icon {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 16px;
        padding: 4px 8px;
        border-radius: 4px;
    }
    
    .btn-icon:hover {
        background: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="teacher-panel-wrapper">
    <header class="teacher-header">
      <div class="header-container">
        <div class="header-brand">
          <span class="brand-name">LearnBox</span>
          <span class="badge">Преподаватель</span>
        </div>
        <nav class="teacher-nav">
          <button class="teacher-nav-item active" data-view="dashboard">
            <span class="icon"></span> Дашборд
          </button>
          <button class="teacher-nav-item" data-view="courses">
            <span class="icon"></span> Мои курсы
          </button>
          <button class="teacher-nav-item" data-view="students">
            <span class="icon"></span> Студенты
          </button>
        </nav>
        <div class="header-actions">
          <button class="btn-secondary" id="back-to-main">
            ← К платформе
          </button>
        </div>
      </div>
    </header>

    <main class="teacher-main">
      <section id="dashboard-view" class="teacher-view active">
        <div class="view-header">
          <h1>Панель преподавателя</h1>
          <p class="subtitle">Общая статистика по вашим курсам</p>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon"></div>
            <div class="stat-content">
              <span class="stat-value" id="total-students">0</span>
              <span class="stat-label">Всего студентов</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"></div>
            <div class="stat-content">
              <span class="stat-value" id="active-courses">0</span>
              <span class="stat-label">Активных курсов</span>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"></div>
            <div class="stat-content">
              <span class="stat-value" id="completed-lessons">0</span>
              <span class="stat-label">Пройдено уроков</span>
            </div>
          </div>
        </div>

        <div class="section-header">
          <h2>Ваши курсы</h2>
        </div>
        <div id="dashboard-courses-list" class="courses-grid">
        </div>
      </section>

      <section id="courses-view" class="teacher-view hidden">
        <div class="view-header">
          <h1>Мои курсы</h1>
          <button class="btn-primary" id="create-course-btn">
            + Создать курс
          </button>
        </div>

        <div id="courses-list" class="courses-grid">
        </div>
      </section>

      <section id="students-view" class="teacher-view hidden">
        <div class="view-header">
          <h1>Мои студенты</h1>
          <div class="filters">
            <select id="course-filter" class="filter-select">
              <option value="">Все курсы</option>
            </select>
          </div>
        </div>

        <div id="students-list" class="students-container">
        </div>
      </section>
    </main>
  </div>

  <div id="student-progress-modal" class="modal hidden">
    <div class="modal-card student-progress-modal">
      <header>
        <h3>Прогресс студента: <span id="student-name"></span></h3>
        <button class="close-btn" onclick="closeStudentProgress()">✕</button>
      </header>
      <div class="modal-content">
        <div class="student-info">
          <p><strong>Email:</strong> <span id="student-email"></span></p>
          <p><strong>Записан:</strong> <span id="student-enrolled"></span></p>
          <p><strong>Общий прогресс:</strong> <span id="student-total-progress"></span>%</p>
        </div>
        
        <div class="progress-tabs">
          <div id="modules-progress" class="modules-progress">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="create-course-modal" class="modal hidden">
    <div class="modal-card">
      <header>
        <h3>Создать новый курс</h3>
        <button class="close-btn" onclick="closeCreateCourse()">✕</button>
      </header>
      <form id="create-course-form">
        <div class="form-group">
          <label>Название курса *</label>
          <input type="text" id="course-title" required>
        </div>
        <div class="form-group">
          <label>Описание</label>
          <textarea id="course-description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Уровень сложности</label>
          <select id="course-difficulty">
            <option value="beginner">Начальный</option>
            <option value="intermediate">Средний</option>
            <option value="advanced">Продвинутый</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Создать</button>
          <button type="button" class="btn-secondary" onclick="closeCreateCourse()">Отмена</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function closeStudentProgress() {
      document.getElementById('student-progress-modal').classList.add('hidden');
    }
    
    function closeCreateCourse() {
      document.getElementById('create-course-modal').classList.add('hidden');
      document.getElementById('create-course-form').reset();
    }
  </script>
  <script type="module" src="../components/TeacherPanel.js"></script>
</body>
</html>
